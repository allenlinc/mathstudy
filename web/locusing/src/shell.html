<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>长方体的展开图 · 11 种折法 — locusing 交互动画</title>
<style>
  :root {
    --bg: #0c0f14;
    --panel: rgba(18, 22, 30, .66);
    --line: rgba(255, 255, 255, .09);
    --text: #e6edf5;
    --muted: #97a2b4;
    --accent: #ea580c;
    --accent2: #ff862f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1100px 700px at 74% 6%, rgba(88, 196, 221, .06), transparent 60%),
      radial-gradient(900px 620px at 10% 94%, rgba(234, 88, 12, .06), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .bg-grid {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(82% 72% at 50% 46%, #000 30%, transparent 100%);
    mask-image: radial-gradient(82% 72% at 50% 46%, #000 30%, transparent 100%);
  }

  header { position: fixed; top: 22px; left: 30px; z-index: 5; pointer-events: none; max-width: 400px; }
  .kicker { font-size: 11px; letter-spacing: .22em; color: var(--accent2); font-weight: 700; margin-bottom: 9px; }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: .02em; }
  h1 .thin { color: var(--muted); font-weight: 400; }
  .steps { margin-top: 11px; display: grid; gap: 6px; }
  .step { display: flex; gap: 9px; align-items: baseline; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .step i {
    font-style: normal; flex: none; width: 19px; height: 19px; border-radius: 50%;
    background: rgba(255, 134, 47, .14); color: var(--accent2);
    font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    transform: translateY(3px); border: 1px solid rgba(255, 134, 47, .35);
  }
  .step b { color: var(--text); font-weight: 600; }

  .panel {
    position: fixed; top: 22px; right: 26px; z-index: 5;
    background: rgba(18, 22, 30, .93); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 15px; width: 248px;
    font-variant-numeric: tabular-nums;
  }
  .panel .cap { font-size: 10.5px; letter-spacing: .16em; color: var(--muted); margin-bottom: 9px; }
  .pats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pat {
    position: relative; font-family: inherit; cursor: pointer;
    background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 9px;
    padding: 5px 4px 3px; transition: border-color .15s ease, background .15s ease;
  }
  .pat:hover { background: #262c38; }
  .pat.sel { border-color: var(--accent2); background: #30201b; }
  .pat svg { width: 100%; height: 30px; display: block; }
  .pat span { display: block; text-align: center; font-size: 9px; color: var(--muted); margin-top: 2px; letter-spacing: .04em; }
  .pat.sel span { color: #ffd9c2; }
  .pat.done::after {
    content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent2);
  }
  .meta { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; font-size: 11.5px; }
  .meta2 { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .meta2 b { color: var(--text); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
  .vol { margin-top: 8px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .vol i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s ease; }
  .finish {
    margin-top: 9px; font-size: 11.5px; line-height: 1.55; color: #ffd9c2;
    background: rgba(234, 88, 12, .13); border: 1px solid rgba(255, 134, 47, .35);
    border-radius: 10px; padding: 7px 9px;
    opacity: 0; transform: translateY(-4px) scale(.97); transition: all .45s cubic-bezier(.2, 0, 0, 1);
    pointer-events: none;
  }
  .finish.show { opacity: 1; transform: none; }
  .legend { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px 8px; }
  .chip { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .chip i { width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,.25); }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #scene { width: min(94vw, 900px); height: auto; max-height: 82vh; touch-action: none; cursor: grab; }
  #scene.grabbing { cursor: grabbing; }

  .dock {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 12px; backdrop-filter: blur(14px); white-space: nowrap;
  }
  .dock button {
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; cursor: pointer; transition: background .15s ease, transform .1s ease;
  }
  .dock button:hover { background: rgba(255,255,255,.14); }
  .dock button:active { transform: scale(.96); }
  .dock button.primary { background: rgba(234, 88, 12, .2); border-color: rgba(255, 134, 47, .45); color: #ffd9c2; }
  .dock button.primary:hover { background: rgba(234, 88, 12, .3); }
  .dock .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .dock .hint { font-size: 12px; color: var(--muted); padding-right: 8px; }
  kbd {
    font-family: ui-monospace, Consolas, monospace; font-size: 11px;
    background: rgba(255,255,255,.08); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 6px; color: var(--text);
  }

  @media (max-width: 1120px) {
    header { max-width: 280px; }
    h1 { font-size: 21px; }
    .step { font-size: 11.5px; }
  }
  @media (max-width: 900px) {
    .panel { display: none; }
    .dock .hint, .dock .sep { display: none; }
  }

  /* ── 移动端：面板默认隐藏，悬浮按钮开合 ── */
  #panelToggle{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:26;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 13px/1 "PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #panelToggle:active{transform:scale(.96)}
  @media (max-width:640px){
    body:not(.mpanel-open) #dock{display:none!important}
    #dock{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(9px, env(safe-area-inset-bottom,0px))}
    #panelToggle{display:flex}
    body.mpanel-open #dock{bottom:60px} /* 底栏居中且与右下悬浮按钮同高，展开时上抬避让，防止盖住「复位视角」 */
  }
  @media (min-width:641px){#panelToggle{display:none!important}}
  @media (hover:none) and (pointer:coarse){ button,.tab,input[type=range],a{touch-action:manipulation;-webkit-tap-highlight-color:transparent} }
</style>
</head>
<body>
  <div class="bg-grid"></div>

  <header>
    <div class="kicker">LOCUSING · 小学数学 · 立体图形</div>
    <h1>长方体的展开图 <span class="thin">· 11 种折法</span></h1>
    <div class="steps">
      <div class="step"><i>1</i><span>按住 <b>鼠标右键</b> 上下左右拖动 —— 旋转长方体</span></div>
      <div class="step"><i>2</i><span><b>长按</b> 一个彩色面，往外 <b>拖动</b> —— 沿折棱把它拉开</span></div>
      <div class="step"><i>3</i><span><b>轻点</b> 一个面 —— 它自己展开或合上</span></div>
      <div class="step"><i>4</i><span>在右侧 <b>换一种折法</b> —— 把 11 种展开图全部拆一遍</span></div>
    </div>
  </header>

  <aside class="panel" aria-label="折法选择与进度">
    <div class="cap">11 种折法 · 点选切换</div>
    <div id="patterns" class="pats"></div>
    <div class="meta">当前折法 <b id="curName">—</b></div>
    <div class="meta2">已体验 <b id="xN">0</b>/11 · 已拉平 <b id="pN">0</b>/5</div>
    <div class="vol"><i id="pBar"></i></div>
    <div id="done" class="finish"></div>
    <div class="legend">
      <div class="chip"><i style="background:#4fc3f7"></i>前</div>
      <div class="chip"><i style="background:#81c784"></i>后</div>
      <div class="chip"><i style="background:#e57373"></i>左</div>
      <div class="chip"><i style="background:#ffd54f"></i>右</div>
      <div class="chip"><i style="background:#ff8a65"></i>上</div>
      <div class="chip"><i style="background:#b39ddb"></i>下</div>
    </div>
  </aside>

  <main id="stage">
    <svg id="scene" viewBox="0 0 860 620" xmlns="http://www.w3.org/2000/svg" aria-label="长方体 11 种展开图交互动画"></svg>
  </main>

  <div class="dock" id="dock">
    <button id="btnAll" class="primary">全部展开</button>
    <button id="btnBox">变回盒子</button>
    <button id="btnView">复位视角</button>
    <div class="sep"></div>
    <div class="hint"><kbd>空格</kbd> 展开 / 变回&nbsp;&nbsp;<kbd>R</kbd> 复位视角</div>
  </div>

<script>
/*__BUNDLE__*/
</script>

<button id="panelToggle" aria-expanded="false" aria-controls="dock">☰ 控制面板</button>
<script>
/* 移动端面板开合：窄屏默认收起，点按切换 */
(function(){
  var btn=document.getElementById('panelToggle');
  var panel=document.getElementById('dock');
  if(!btn||!panel) return;
  function sync(){var open=document.body.classList.contains('mpanel-open');btn.setAttribute('aria-expanded',open?'true':'false');btn.textContent=open?'✕ 收起面板':'☰ 控制面板';}
  btn.addEventListener('click',function(e){e.stopPropagation();document.body.classList.toggle('mpanel-open');sync();});
  sync();
})();
</script>
</body>
</html>
